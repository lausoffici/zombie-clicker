name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write config.js from secrets (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Strip BOM/CR/whitespace (PowerShell `gh secret set` pipes can inject U+FEFF)
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d '\r' | sed $'s/^\xEF\xBB\xBF//;s/^[[:space:]]*//;s/[[:space:]]*$//')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r' | sed $'s/^\xEF\xBB\xBF//;s/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            cat > config.js <<EOF
          window.ZombieClickerConfig = {
            supabaseUrl: "${URL}",
            supabaseAnonKey: "${KEY}"
          };
          EOF
            echo "config.js written from secrets"
          else
            echo "No Supabase secrets set; cloud auth will stay disabled on Pages"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
