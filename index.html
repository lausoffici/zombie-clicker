<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Clicker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="score-box">
        <span id="score-label">Cerebros</span>
        <span id="score-value">0</span>
        <span id="bps-value">0 /s</span>
      </div>
      <div id="top-actions">
        <button id="btn-save" title="Guardar">💾</button>
        <button id="btn-reset" title="Reiniciar">🔄</button>
      </div>
    </header>

    <main id="main">
      <section id="left-panel">
        <div id="zombie-area">
          <div id="zombie" class="zombie">🧟</div>
          <div id="click-power">+1 por click</div>
        </div>
        <div id="stats">
          <div class="stat"><span>Total clicks:</span> <span id="stat-clicks">0</span></div>
          <div class="stat"><span>Total cerebros:</span> <span id="stat-total">0</span></div>
        </div>
      </section>

      <section id="right-panel">
        <h2>Generadores</h2>
        <div id="generators"></div>
        <h2>Mejoras</h2>
        <div id="upgrades"></div>
      </section>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
